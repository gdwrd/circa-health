name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing release secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD must all be set in the repo"
            exit 1
          fi
          base64 -d <<<"$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: ./gradlew assembleRelease --stacktrace
      - name: Verify signature
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          out=$("$apksigner" verify --print-certs "$apk")
          printf '%s\n' "$out"
          digest=$(printf '%s\n' "$out" | grep -i 'sha-256 digest' | awk '{print $NF}')
          # Android refuses an app upgrade signed by a different cert, so the digest must still start 3c236b22
          case "${digest,,}" in
            3c236b22*) ;;
            *)
              echo "::error::Signing cert changed: SHA-256 digest must start with 3c236b22 for Android to allow the upgrade"
              exit 1
              ;;
          esac
          cp "$apk" "ring-health-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: ring-health-${{ github.ref_name }}.apk
          generate_release_notes: true
